<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Java ecosystem architecture from bottom to top">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .infra { fill: #2563eb; }
      .runtime { fill: #16a34a; }
      .app { fill: #f97316; }
      .text { fill: #ffffff; font-family: Arial, sans-serif; font-weight: 700; }
      .sub { fill: #ffffff; font-family: Arial, sans-serif; font-size: 16px; opacity: .95; }
      .title { fill: #111827; font-family: Arial, sans-serif; font-size: 34px; font-weight: 800; }
      .label { fill: #334155; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .arrow { stroke: #334155; stroke-width: 4; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" width="900" height="650" rx="24"/>

  <text x="450" y="55" text-anchor="middle" class="title">Java Ecosystem Architecture</text>
  <text x="450" y="88" text-anchor="middle" class="label">From infrastructure to developer-facing applications</text>

  <rect x="130" y="120" width="640" height="110" rx="22" class="app"/>
  <text x="450" y="160" text-anchor="middle" class="text" font-size="27">Application Layer</text>
  <text x="450" y="195" text-anchor="middle" class="sub">Spring Boot • Jakarta EE • Android • Desktop • Microservices</text>

  <rect x="170" y="275" width="560" height="115" rx="22" class="runtime"/>
  <text x="450" y="316" text-anchor="middle" class="text" font-size="26">Frameworks &amp; Runtime</text>
  <text x="450" y="352" text-anchor="middle" class="sub">JVM • JRE • JDK • Maven • Gradle • Libraries</text>

  <rect x="210" y="440" width="480" height="115" rx="22" class="infra"/>
  <text x="450" y="481" text-anchor="middle" class="text" font-size="26">Platform Foundation</text>
  <text x="450" y="517" text-anchor="middle" class="sub">Operating System • Hardware • Cloud • Containers</text>

  <line x1="450" y1="440" x2="450" y2="400" class="arrow"/>
  <line x1="450" y1="275" x2="450" y2="240" class="arrow"/>

  <text x="720" y="505" class="label">Base</text>
  <text x="760" y="340" class="label">Execution</text>
  <text x="790" y="180" class="label">Solutions</text>
</svg>
